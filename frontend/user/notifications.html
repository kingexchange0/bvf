<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - BrightVale Finance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script>window.PAGE_CONFIG = { role: 'user', active: 'notifications', title: 'Notifications' };</script>
  <script src="../js/main.js"></script>
  <style>
    .notif-list { display: flex; flex-direction: column; gap: 10px; }
    .notif-row {
      display: flex; align-items: flex-start; gap: 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
      padding: 14px 16px; cursor: pointer; transition: border-color .2s ease, background-color .2s ease;
    }
    .notif-row:hover { border-color: var(--primary); }
    .notif-row.unread { background: var(--primary-soft); border-color: var(--primary-soft); }
    .notif-row .notif-icon { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: var(--surface-2); color: var(--text-2); }
    .notif-row .notif-icon.t-success { background: var(--success-soft); color: var(--success); }
    .notif-row .notif-icon.t-warning { background: var(--warning-soft); color: var(--warning); }
    .notif-row .notif-icon.t-error { background: var(--danger-soft); color: var(--danger); }
    .notif-row .notif-icon.t-info { background: var(--info-soft); color: var(--info); }
    .notif-row .notif-body { flex: 1; min-width: 0; }
    .notif-row .notif-title { font-weight: 700; font-size: 14px; color: var(--text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .notif-row .notif-msg { font-size: 13px; color: var(--text-2); margin-top: 2px; }
    .notif-row .notif-time { font-size: 12px; color: var(--text-3); white-space: nowrap; margin-top: 4px; }
    .notif-row .notif-actions { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <main class="main-content" id="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Notifications</h1>
        <p class="page-subtitle">Stay up to date with your account.</p>
      </div>
      <div class="flex gap-8">
        <div class="tabs" id="filterTabs">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="unread">Unread</button>
        </div>
        <button class="btn btn-primary btn-sm" id="markAllBtn"><i class="fas fa-check-double"></i> Mark all read</button>
      </div>
    </div>

    <div id="notifWrap"><div class="loading"><div class="spinner"></div></div></div>
    <div class="table-footer mt-12">
      <span id="notifInfo"></span>
      <div id="paginationWrap"></div>
    </div>
  </main>

  <script>
    const TYPE_META = {
      success: { icon: 'fa-circle-check', cls: 't-success' },
      warning: { icon: 'fa-triangle-exclamation', cls: 't-warning' },
      error: { icon: 'fa-circle-xmark', cls: 't-error' },
      info: { icon: 'fa-circle-info', cls: 't-info' }
    };
    let currentFilter = 'all';
    let currentPage = 1;

    function notifRow(n) {
      const meta = TYPE_META[n.type] || TYPE_META.info;
      return `
        <div class="notif-row ${n.isRead ? '' : 'unread'}" data-id="${utils.escapeHtml(n._id)}" data-read="${n.isRead ? '1' : ''}">
          <span class="notif-icon ${meta.cls}"><i class="fas ${meta.icon}"></i></span>
          <div class="notif-body">
            <div class="notif-title">
              ${utils.escapeHtml(n.title || 'Notification')}
              ${n.isRead ? '' : '<span class="badge-dot"></span>'}
            </div>
            ${n.message ? `<div class="notif-msg">${utils.escapeHtml(n.message)}</div>` : ''}
            <div class="notif-time">${utils.timeAgo(n.createdAt)}</div>
          </div>
          <div class="notif-actions">
            <button class="icon-btn notif-delete" data-id="${utils.escapeHtml(n._id)}" title="Delete" style="width:34px;height:34px;font-size:13px;"><i class="fas fa-trash"></i></button>
          </div>
        </div>`;
    }

    async function load(page) {
      currentPage = page || 1;
      const params = new URLSearchParams({ page: currentPage, limit: 15 });
      if (currentFilter === 'unread') params.set('unreadOnly', 'true');
      try {
        const res = await api.get('/notifications?' + params.toString());
        if (!res || !res.success) {
          toast.error((res && res.message) || 'Failed to load notifications');
          return;
        }
        const list = res.data || [];
        const wrap = document.getElementById('notifWrap');
        if (!list.length) {
          wrap.innerHTML = `
            <div class="empty-state" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">
              <div class="empty-icon"><i class="fas fa-bell-slash"></i></div>
              <div class="empty-title">${currentFilter === 'unread' ? 'No unread notifications' : 'No notifications'}</div>
              <div class="empty-hint">You are all caught up. Account updates will appear here.</div>
            </div>`;
        } else {
          wrap.innerHTML = '<div class="notif-list">' + list.map(notifRow).join('') + '</div>';
        }
        const unread = typeof res.unreadCount === 'number' ? res.unreadCount : 0;
        document.getElementById('notifInfo').textContent =
          `${paginationText(res.pagination)}${unread ? ` &middot; ${unread} unread` : ''}`;
        pagination.render('paginationWrap', (res.pagination && res.pagination.currentPage) || 1, (res.pagination && res.pagination.pages) || 1, 'goToPage');
      } catch (e) {
        toast.error('Failed to load notifications');
      }
    }

    function paginationText(p) {
      if (!p || !p.total) return '0 notifications';
      return `Showing page ${p.currentPage} of ${p.pages} (${p.total} total)`;
    }

    window.goToPage = function(page) {
      load(page);
    };

    async function markRead(id, row) {
      try {
        const res = await api.put(`/notifications/${id}/read`);
        if (res && res.success) {
          row.classList.remove('unread');
          row.dataset.read = '1';
          row.querySelector('.badge-dot') && row.querySelector('.badge-dot').remove();
          load(currentPage);
        }
      } catch (e) { /* keep row as-is */ }
    }

    document.getElementById('notifWrap').addEventListener('click', async (e) => {
      const delBtn = e.target.closest('.notif-delete');
      if (delBtn) {
        e.stopPropagation();
        const id = delBtn.dataset.id;
        try {
          const res = await api.delete(`/notifications/${id}`);
          if (res && res.success) {
            toast.success('Notification deleted');
            load(currentPage);
          } else {
            toast.error((res && res.message) || 'Delete failed');
          }
        } catch (err) {
          toast.error('Delete failed');
        }
        return;
      }
      const row = e.target.closest('.notif-row');
      if (row && !row.dataset.read) {
        markRead(row.dataset.id, row);
      }
    });

    document.getElementById('markAllBtn').addEventListener('click', async () => {
      try {
        const res = await api.put('/notifications/read-all/all');
        if (res && res.success) {
          toast.success('All notifications marked as read');
          load(1);
        } else {
          toast.error((res && res.message) || 'Action failed');
        }
      } catch (e) {
        toast.error('Action failed');
      }
    });

    document.getElementById('filterTabs').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('#filterTabs .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      load(1);
    });

    load(1);
    setInterval(() => { if (currentPage === 1) load(1); }, 30000);
  </script>
</body>
</html>
