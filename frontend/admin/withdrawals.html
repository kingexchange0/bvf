<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdrawals - BrightVale Finance Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script>window.PAGE_CONFIG = { role: 'admin', active: 'withdrawals', title: 'Withdrawals' };</script>
  <script src="../js/main.js"></script>
</head>
<body>
  <main class="main-content" id="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Withdrawals</h1>
        <p class="page-subtitle">Review and process user withdrawal requests.</p>
      </div>
    </div>

    <div class="card">
      <div class="filter-bar mb-16">
        <select class="select" id="statusFilter" style="width: auto;">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="declined">Declined</option>
        </select>
        <button class="btn btn-primary" id="applyBtn"><i class="fas fa-filter"></i> Apply</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>User</th><th>Amount</th><th>Destination</th><th>Status</th><th>Date</th><th>Actions</th></tr>
          </thead>
          <tbody id="withdrawalsBody"></tbody>
        </table>
      </div>
      <div class="table-footer">
        <span id="withdrawalsCount"></span>
        <div id="withdrawalsPagination"></div>
      </div>
    </div>
  </main>

  <!-- Approve / decline note modal -->
  <div class="modal-overlay" id="actionModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="actionTitle">Process withdrawal</div>
        <button class="modal-close" onclick="modal.close('actionModal')"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p class="text-small text-muted mb-8" id="actionSummary"></p>
        <div class="form-group">
          <label class="form-label" for="actionNote">Admin note (optional)</label>
          <textarea class="textarea" id="actionNote" style="min-height: 80px;" placeholder="Add an internal note for this decision"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="modal.close('actionModal')">Cancel</button>
        <button class="btn btn-primary" id="actionConfirmBtn"><i class="fas fa-check"></i> Confirm</button>
      </div>
    </div>
  </div>

  <script>
    if (!auth.requireAdmin()) throw new Error('Admin access required');

    const esc = utils.escapeHtml;
    const state = { page: 1, limit: 20, status: '' };
    let actionState = { id: null, action: null };

    const badgeClass = (s) => {
      s = (s || '').toLowerCase();
      if (['approved', 'completed', 'active', 'paid', 'verified', 'available', 'sold'].includes(s)) return 'badge-success';
      if (['pending', 'processing'].includes(s)) return 'badge-warning';
      if (['declined', 'rejected', 'suspended', 'cancelled', 'canceled', 'failed', 'defaulted'].includes(s)) return 'badge-danger';
      if (['draft', 'unavailable', 'inactive', 'not_submitted'].includes(s)) return 'badge-muted';
      if (s === 'featured') return 'badge-primary';
      return 'badge-muted';
    };
    const badge = (s) => `<span class="badge ${badgeClass(s)}">${esc(s ? String(s).replace(/_/g, ' ') : 'N/A')}</span>`;

    const destination = (w) => {
      if (w.type === 'btc') {
        return `<span class="badge badge-info">BTC</span><div class="text-small text-muted mono" style="max-width: 160px; overflow: hidden; text-overflow: ellipsis;">${esc(w.walletAddress || '—')}</div>`;
      }
      const b = w.bankDetails || {};
      return `<span class="badge badge-muted">Bank</span>
        <div class="text-small text-muted">${esc(b.bankName || '—')} &middot; ${esc(b.accountNumber || '—')}</div>
        <div class="text-small text-muted">${esc(b.accountName || '')}</div>`;
    };

    async function loadWithdrawals() {
      loading.show('withdrawalsBody');
      try {
        const params = new URLSearchParams({ page: state.page, limit: state.limit });
        if (state.status) params.set('status', state.status);
        const res = await api.get(`/withdrawals?${params.toString()}`);
        if (!res.success) {
          toast.error(res.message || 'Failed to load withdrawals');
          return;
        }
        const withdrawals = res.data || [];
        document.getElementById('withdrawalsBody').innerHTML = withdrawals.length
          ? withdrawals.map(w => `
              <tr>
                <td>
                  ${esc((w.userId && w.userId.name) || 'Deleted user')}
                  <div class="text-small text-muted">${esc((w.userId && w.userId.email) || '')}</div>
                </td>
                <td>${utils.formatCurrency(w.amount)}</td>
                <td>${destination(w)}</td>
                <td>${badge(w.status)}</td>
                <td>${utils.formatDateTime(w.createdAt)}</td>
                <td>
                  ${w.status === 'pending' ? `
                    <div class="flex gap-4">
                      <button class="btn btn-sm btn-primary" onclick="openAction('${w._id}', 'approve', ${Number(w.amount)})"><i class="fas fa-check"></i> Approve</button>
                      <button class="btn btn-sm btn-danger-soft" onclick="openAction('${w._id}', 'decline', ${Number(w.amount)})"><i class="fas fa-xmark"></i> Decline</button>
                    </div>` : `<span class="text-small text-muted">${w.adminNote ? esc(w.adminNote) : 'Processed'}</span>`}
                </td>
              </tr>`).join('')
          : `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon"><i class="fas fa-upload"></i></div><div class="empty-title">No withdrawals found</div><div class="empty-hint">Withdrawal requests will appear here once users submit them.</div></div></td></tr>`;

        const p = res.pagination || {};
        document.getElementById('withdrawalsCount').textContent = `${p.total || withdrawals.length} withdrawal(s)`;
        pagination.render('withdrawalsPagination', Number(p.currentPage) || 1, Number(p.pages) || 1, 'goToPage');
      } catch (error) {
        console.error(error);
        toast.error('Failed to load withdrawals');
      } finally {
        loading.hide('withdrawalsBody');
      }
    }

    function goToPage(page) {
      state.page = page;
      loadWithdrawals();
    }

    function openAction(id, action, amount) {
      actionState = { id, action };
      document.getElementById('actionTitle').textContent = action === 'approve' ? 'Approve withdrawal' : 'Decline withdrawal';
      document.getElementById('actionSummary').textContent =
        `You are about to ${action} a withdrawal of ${utils.formatCurrency(amount)}.`;
      document.getElementById('actionNote').value = '';
      document.getElementById('actionConfirmBtn').className = action === 'approve' ? 'btn btn-primary' : 'btn btn-danger-soft';
      modal.open('actionModal');
    }

    document.getElementById('actionConfirmBtn').addEventListener('click', async () => {
      if (!actionState.id) return;
      const btn = document.getElementById('actionConfirmBtn');
      btn.disabled = true;
      try {
        const res = await api.put(`/withdrawals/admin/${actionState.id}/${actionState.action}`, {
          adminNote: document.getElementById('actionNote').value.trim()
        });
        if (res.success) {
          toast.success(res.message || 'Withdrawal updated');
          modal.close('actionModal');
          loadWithdrawals();
        } else {
          toast.error(res.message || 'Operation failed');
        }
      } catch (error) {
        console.error(error);
        toast.error('Operation failed');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('applyBtn').addEventListener('click', () => {
      state.status = document.getElementById('statusFilter').value;
      state.page = 1;
      loadWithdrawals();
    });

    // Preselect status from query string, e.g. withdrawals.html?status=pending
    const preset = new URLSearchParams(location.search).get('status');
    if (preset) {
      document.getElementById('statusFilter').value = preset;
      state.status = preset;
    }
    loadWithdrawals();
  </script>
</body>
</html>
